# 高地导航专用参数

# 高地坐标
high_ground:
  x: 5.0
  y: 5.0
  z: 0.0
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0

# 自动导航配置
auto_navigation:
  enabled: true
  delay_before_start: 3.0  # 秒
  retry_on_failure: true
  max_retries: 3
  
# 导航参数调整（针对高地地形）
navigation:
  planner_server:
    planner_plugins: ["GridBased"]
    GridBased:
      use_final_approach_orientation: true
      tolerance: 0.5
      
  controller_server:
    controller_frequency: 20.0
    progress_checker:
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
      
  bt_navigator:
    default_nav_to_pose_bt_xml: "behavior_trees/auto_navigate_to_high_ground.xml"
    behavior_tree: "behavior_trees/auto_navigate_to_high_ground.xml"